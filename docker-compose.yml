services:
  ollama:
    image: ollama/ollama:latest
    container_name: pseudonym-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pseudonym-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:26b
      - DATA_DIR=/data
    depends_on:
      ollama:
        condition: service_healthy

  devcontainer:
    profiles:
      - dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - .:/workspace:cached
    environment:
      - DATA_DIR=/tmp/pseudonym-data
      - PYTHONPATH=/workspace
    command: sleep infinity

  model-pull:
    image: curlimages/curl:latest
    container_name: pseudonym-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 'Pulling model gemma4:26b...' &&
             curl -s http://ollama:11434/api/pull -d '{\"name\": \"gemma4:26b\"}' &&
             echo 'Model pull complete.'"
    restart: "no"

volumes:
  ollama_data:
