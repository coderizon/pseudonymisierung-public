# APQC PCF: Process Classification Framework
#
# Source: American Productivity & Quality Center (APQC)
# Used for PROCESS_ARTIFACT category generalization.
# Maps proprietary process names to standardized process categories.
#
# Note: The APQC PCF is a proprietary framework. This file contains
# publicly available top-level category names and common process group
# descriptions. Organizations requiring the full detailed framework
# should license it from APQC.
#
# Structure: 2 levels (v1)
#   Level 1: Category (13 categories, numbered 1.0-13.0)
#   Level 2: Process group (numbered x.y)

metadata:
  name: "APQC PCF"
  source: "American Productivity & Quality Center (APQC)"
  levels: 2
  level_names: ["category", "process_group"]

entries:
  # Operating processes (1.0-5.0)
